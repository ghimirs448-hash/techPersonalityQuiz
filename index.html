
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Personality Quiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container my-5">
        <header class="text-center mb-4">
            <h1>Tech Personality Quiz</h1>
            <p>Discover what type of tech person you are!</p>
        </header>

        <main>
            <div id="quiz-container">

                <!-- Question 1 -->
                <div class="question-block card p-4 mb-3">
                    <h2 class="h5">1. What do you enjoy most about technology?</h2>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="1">Solving problems</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="2">Designing websites</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="3">Leading projects</button>
                </div>

                <!-- Question 2 -->
                <div class="question-block card p-4 mb-3">
                    <h2 class="h5">2. Which activity sounds most interesting?</h2>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="1">Writing code</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="2">Creating designs</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="3">Managing a team</button>
                </div>

                <!-- Question 3 -->
                <div class="question-block card p-4 mb-3">
                    <h2 class="h5">3. How do you approach a challenge?</h2>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="1">Think logically</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="2">Be creative</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="3">Make a plan</button>
                </div>

                <!-- Question 4 -->
                <div class="question-block card p-4 mb-3">
                    <h2 class="h5">4. What is your dream project?</h2>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="1">Developing AI software</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="2">Designing an app</button>
                    <button class="answer-btn btn btn-outline-primary m-1" data-answer="3">Starting a tech company</button>
                </div>

            </div>

            <div class="text-center mt-4">
                <button id="show-result" class="btn btn-success btn-lg">
                    Show Results
                </button>
            </div>

            <div id="result-container" class="mt-4 text-center" aria-live="polite"></div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
